services:
  postgres:
    image: postgis/postgis:15-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: elsewhere
      POSTGRES_PASSWORD: elsewhere
      POSTGRES_DB: elsewhere_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elsewhere"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["5432:5432"]
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["6379:6379"]
  app:
    image: elsewhere-phase0
    build: .
    # Provider keys and the LLM endpoint live in .env, which is never committed. Compose reads .env for its own
    # interpolation whether or not it is named here, so without env_file the app container saw none of it and
    # every AI::Task came back degraded with the model sitting idle on the host.
    env_file:
      - path: .env
        required: false
    # These four override .env on purpose: inside the network the database and Redis are reachable by service
    # name, not by the localhost address a host-side run would use.
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://elsewhere:elsewhere@postgres/elsewhere_development
      TEST_DATABASE_URL: postgres://elsewhere:elsewhere@postgres/elsewhere_test
      REDIS_URL: redis://redis:6379/0
      SUPPLY_MODE: ${SUPPLY_MODE:-fixture}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3000:3000"]
    volumes: [".:/app"]
