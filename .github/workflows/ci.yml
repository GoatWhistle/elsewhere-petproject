name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_USER: elsewhere
          POSTGRES_PASSWORD: elsewhere
          POSTGRES_DB: elsewhere_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elsewhere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true
      - run: bin/rails db:prepare
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://elsewhere:elsewhere@localhost:5432/elsewhere_test
      - run: bin/packwerk_check
      - run: bundle exec rspec
        env:
          RAILS_ENV: test
          TEST_DATABASE_URL: postgres://elsewhere:elsewhere@localhost:5432/elsewhere_test
      - run: npm ci --prefix web
      - run: npm run check --prefix web
      - run: npm run lint --prefix web
      - run: npm run build --prefix web
